{% extends 'base.html' %}

{% block title %}Register Passkey - My WiFi Pass{% endblock %}

{% block content %}
<div class="event-container">
    <h2 class="event-title">Register Passkey</h2>
    
    <form id="passkeyForm" class="my-form">
        <div class="form-fields">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required 
                   placeholder="your.email@example.com">
            <small style="color: #999; display: block; margin-top: -10px; margin-bottom: 15px;">Your registered email address</small>

            <div id="statusMessage" class="alert d-none" style="margin-bottom: 15px;" role="alert"></div>
        </div>

        <div class="submit-row text-center">
            <button type="button" id="registerBtn" class="my-button">
                Register with Passkey
            </button>
            <button type="button" id="backBtn" class="my-button" style="margin-top: 10px; background-color: #ccc; color: #333;">
                Back
            </button>
        </div>
    </form>

    <div id="successMessage" class="alert alert-success d-none" style="margin-top: 20px; padding: 20px; border-radius: 8px;" role="alert">
        <h5 style="color: var(--primary-color);">Passkey Registration Successful!</h5>
        <p>Your passkey has been registered and is ready to use for authentication.</p>
    </div>
</div>

<script>
function bufferToBase64url(buffer) {
    const bytes = new Uint8Array(buffer);
    let str = '';
    for (let char of bytes) {
        str += String.fromCharCode(char);
    }
    return btoa(str)
        .replace(/\+/g, '-')
        .replace(/\//g, '_')
        .replace(/=/g, '');
}

// WebAuthn Registration Flow
document.getElementById('registerBtn').addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const statusDiv = document.getElementById('statusMessage');
    const registerBtn = document.getElementById('registerBtn');
    
    if (!email) {
        showStatus('Please enter your email', 'danger');
        return;
    }

    try {
        registerBtn.disabled = true;
        // Step 1: Get registration challenge from server
        showStatus('Generating registration challenge...', 'info');
        
        const startResponse = await fetch('/fido2/register/start/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({ email: email })
        });

        if (!startResponse.ok) {
            const error = await startResponse.json();
            throw new Error(error.error || 'Failed to start registration');
        }

        const options = await startResponse.json();
        showStatus('Challenge received. Please complete registration on your device...', 'info');

        // Step 2: Create credential using device authenticator
        const credential = await navigator.credentials.create({
            publicKey: {
                challenge: new Uint8Array(base64ToArrayBuffer(options.challenge)),
                rp: options.rp,
                user: {
                    id: new Uint8Array(base64ToArrayBuffer(options.user.id)),
                    name: options.user.name,
                    displayName: options.user.displayName
                },
                pubKeyCredParams: options.pubKeyCredParams,
                timeout: options.timeout,
                attestation: options.attestation,
                authenticatorSelection: options.authenticatorSelection
            }
        });

        if (!credential) {
            throw new Error('Registration was cancelled');
        }

        // Step 3: Send credential to server for verification
        // Manually serialize credential to avoid browser toJSON() inconsistencies
        const credentialData = {
            id: credential.id,
            rawId: bufferToBase64url(credential.rawId),
            type: credential.type,
            response: {
                attestationObject: bufferToBase64url(credential.response.attestationObject),
                clientDataJSON: bufferToBase64url(credential.response.clientDataJSON),
                transports: credential.response.getTransports ? credential.response.getTransports() : []
            },
            authenticatorAttachment: credential.authenticatorAttachment
        };

        showStatus('Verifying credential...', 'info');

        const finishResponse = await fetch('/fido2/register/finish/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({
                email: email,
                credential: credentialData
            })
        });

        if (!finishResponse.ok) {
            const error = await finishResponse.json();
            throw new Error(error.error || 'Failed to complete registration');
        }

        const result = await finishResponse.json();
        showStatus('', 'info');
        document.getElementById('passkeyForm').classList.add('d-none');
        document.getElementById('successMessage').classList.remove('d-none');

    } catch (error) {
        console.error('Registration error:', error);
        showStatus('Error: ' + error.message, 'danger');
    } finally {
        registerBtn.disabled = false;
    }
});

document.getElementById('backBtn').addEventListener('click', () => {
    window.location.href = '/';
});

function showStatus(message, type) {
    const statusDiv = document.getElementById('statusMessage');
    if (message) {
        statusDiv.textContent = message;
        statusDiv.className = 'alert alert-' + type + '';
        statusDiv.classList.remove('d-none');
    } else {
        statusDiv.classList.add('d-none');
    }
}

function base64ToArrayBuffer(base64url) {
    // Convert base64url to base64 (add padding and replace chars)
    const base64 = base64url
        .replace(/-/g, '+')
        .replace(/_/g, '/')
        .padEnd(base64url.length + (4 - (base64url.length % 4)) % 4, '=');
    
    const binaryString = atob(base64);
    const bytes = new Uint8Array(binaryString.length);
    for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
    }
    return bytes.buffer;
}

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
</script>
{% endblock %}
